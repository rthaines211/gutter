<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="1024" height="1024">
  <!-- "Spines · pulled" — the Longbox mark, Ink tile.
       Geometry per the design handoff, on a 120x120 grid. -->
  <rect width="120" height="120" fill="#1B1720"/>
  <g fill="#F8F0DD">
    <rect x="22" y="26" width="16" height="68" rx="2"/>
    <rect x="66" y="30" width="16" height="64" rx="2"/>
    <rect x="88" y="36" width="12" height="58" rx="2"/>
  </g>
  <!-- the pulled spine, tipped -8 degrees about (52,56) -->
  <path d="M44 18 h17 v76 H44z" fill="#0A84FF" transform="rotate(-8 52 56)"/>
  <path d="M18 100 h84" stroke="#F8F0DD" stroke-width="7" stroke-linecap="round" fill="none"/>
</svg>
